# cargo about settings. Generates THIRD_PARTY_NOTICES.md (docs/design-policy.md chapter 9)
# Generate: cargo about generate about.hbs -o THIRD_PARTY_NOTICES.md
# Some crates ship no LICENSE file and their texts are fetched from the original repositories, so this needs the network

# For an "A OR B" license, the one earlier in this list is used
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
]
# Keep in line with [graph] targets in deny.toml
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
# Test-only and build-time dependencies don't go into the binary
ignore-dev-dependencies = true
ignore-build-dependencies = true
# cargo about's built-in workaround. chrono puts MIT and Apache-2.0 in one file
workarounds = ["chrono"]

[jpeg-encoder]
accepted = ["IJG"]

# ArtServer itself. Names its license file explicitly, so that VectorCraft's license files under vendor/ aren't counted as ArtServer's
[artserver]
clarify = { license = "MIT", files = [{ path = "LICENSE", license = "MIT", checksum = "3701a8f0da4aaa48c540dfdfa7f0011e823f033f144e3e9ecadc3f4cbd67640e" }] }

# Below: crates that ship no LICENSE file, or ship it in a form that can't be read.
# checksum is the file's SHA-256. If the file changes, generation fails: check it and update the checksum

# VectorCraft's crates only have LICENSE-MIT at the repository root
[vectorcraft-affinity]
clarify = { license = "MIT OR Apache-2.0", git = [{ path = "LICENSE-MIT", license = "MIT", checksum = "8b6025dc4b707e0fb08b9c2054096f1be3ae61529399aa2c348dec676562dc71" }] }
