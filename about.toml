# cargo about の設定。THIRD_PARTY_NOTICES.md を生成する（docs/design-policy.md 9章）
# 生成: cargo about generate about.hbs -o THIRD_PARTY_NOTICES.md
# LICENSE ファイルを同梱していないクレートの一部は、元のリポジトリから取得するためネットワークが必要

# 「A OR B」のライセンスでは、この並びで先にあるものを採用する
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
]
# deny.toml の [graph] targets と揃える
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
# テスト用・ビルド時だけの依存はバイナリに入らない
ignore-dev-dependencies = true
ignore-build-dependencies = true
# cargo about に組み込みの対処。chrono は MIT と Apache-2.0 を1つのファイルにまとめている
workarounds = ["chrono"]

[jpeg-encoder]
accepted = ["IJG"]

# 以下は LICENSE ファイルを同梱していない、または読み取れない形で同梱しているクレートの指定。
# checksum はファイルの SHA-256。ファイルが変わると生成が失敗するので、確認して更新する

# VectorCraft のクレートは、リポジトリ直下の LICENSE-MIT だけを持つ
[vectorcraft-affinity]
clarify = { license = "MIT OR Apache-2.0", git = [{ path = "LICENSE-MIT", license = "MIT", checksum = "8b6025dc4b707e0fb08b9c2054096f1be3ae61529399aa2c348dec676562dc71" }] }
