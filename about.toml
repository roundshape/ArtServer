# BSD-3-Clause/MIT のうち、同梱している BSD-3-Clause の文面を使う
[brotli-decompressor]
clarify = { license = "BSD-3-Clause", files = [{ path = "LICENSE", license = "BSD-3-Clause", checksum = "c0c56f26d9c051cac4d200c34c84e7ae9aaa853e01a982a1df08b09931e518ae" }] }

# LICENSE.txt のうち MIT の部分（start〜end の文字列で切り出す）
[libm]
clarify = { license = "MIT", files = [{ path = "LICENSE.txt", license = "MIT", start = "Permission is hereby granted", end = "SOFTWARE.", checksum = "21a2121221d2a35df2d8d333d00a61ed240446b6107092741ff996941acdc919" }] }

