# cargo deny settings. Checks the licenses, vulnerabilities and sources of the dependencies (docs/design-policy.md chapter 9)
# Run: cargo deny check

[graph]
# The targets of the distributed binary. Dependencies only for other OSes aren't checked
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
# Dependencies used only by tests don't go into the binary, so they are excluded
exclude-dev = true

[advisories]
ignore = []

[licenses]
# GPL / LGPL / MPL / proprietary licenses are not allowed
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
]
confidence-threshold = 0.8
exceptions = [
    # (MIT OR Apache-2.0) AND IJG. The IJG wording goes into THIRD_PARTY_NOTICES
    { crate = "jpeg-encoder", allow = ["IJG"] },
]

[bans]
multiple-versions = "allow"
# VectorCraft is pinned to a git commit without a version, so it counts as a wildcard
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The VectorCraft engine and the patched PDF backend ([patch.crates-io] in Cargo.toml)
allow-git = [
    "https://github.com/storytold/vectorcraft",
    "https://github.com/storytold/craft-libs",
]
