# Checks that ArtServer builds on Linux. Tests are not run (docs/progress.md 2026-10-18)
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the older run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # Carry the dependencies' build results over to the next run, to make it shorter
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
