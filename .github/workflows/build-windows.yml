# Checks that ArtServer builds on Windows. Tests are not run (docs/progress.md 2026-10-18)
# In a private repository, Windows machines use up the free minutes about twice as fast as Linux, so this doesn't run
# on push; it runs only when started by hand from GitHub's Actions page (or with gh workflow run build-windows.yml)
name: build-windows

on:
  workflow_dispatch:

permissions:
  contents: read

# A new run cancels older runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # Carry the dependencies' build results over to the next run, to make it shorter
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
