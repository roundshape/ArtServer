[package]
name = "artserver"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Headless vector graphics server driven over MCP (Streamable HTTP), built on the VectorCraft engine"
publish = false

[dependencies]
# The VectorCraft engine, pinned to a commit (docs/design-policy.md chapter 8)
vectorcraft-engine = { git = "https://github.com/storytold/vectorcraft", rev = "904f0fe5227bd987d55319e89a38b4b8f046998c" }
vectorcraft-render = { git = "https://github.com/storytold/vectorcraft", rev = "904f0fe5227bd987d55319e89a38b4b8f046998c" }
vectorcraft-text = { git = "https://github.com/storytold/vectorcraft", rev = "904f0fe5227bd987d55319e89a38b4b8f046998c" }
# Only the tool part of VectorCraft's MCP (call_tool and Backend; docs/design-policy.md section 4.7)
vectorcraft-mcp = { git = "https://github.com/storytold/vectorcraft", rev = "904f0fe5227bd987d55319e89a38b4b8f046998c" }
# The native .vectorcraft format, to tell uploaded files in it from their contents (src/uploads.rs)
vectorcraft-format = { git = "https://github.com/storytold/vectorcraft", rev = "904f0fe5227bd987d55319e89a38b4b8f046998c" }

# MCP (the official Rust SDK). Pinned to the minor version, because the transport sometimes changes between minor versions
rmcp = { version = "~3.5", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
http = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-util = "0.7"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.3"
subtle = "2"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rmcp = { version = "~3.5", features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13", features = ["json"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

# VectorCraft's workspace settings don't carry over to dependents, so they are copied here (VectorCraft Cargo.toml:116-130)
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

# Replace the PDF backend with craft-libs' patched version. Keep this in sync when raising VectorCraft's rev
[patch.crates-io]
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "ca50d63b773c99f96e75c77ce5a1d21e7c9cda0d" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "ca50d63b773c99f96e75c77ce5a1d21e7c9cda0d" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "ca50d63b773c99f96e75c77ce5a1d21e7c9cda0d" }
krilla = { git = "https://github.com/storytold/craft-libs", rev = "ca50d63b773c99f96e75c77ce5a1d21e7c9cda0d" }

# VectorCraft crates fixed by ArtServer. The fixes and how to reapply them are in vendor/README.md
[patch."https://github.com/storytold/vectorcraft"]
vectorcraft-svg = { path = "vendor/vectorcraft-svg" }
