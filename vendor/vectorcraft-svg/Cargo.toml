# A copy of VectorCraft's vectorcraft-svg that ArtServer patches and uses (commit 904f0fe5227bd987d55319e89a38b4b8f046998c, v0.13.1).
# For the fix and how to reapply it when updating VectorCraft, see vendor/README.md.
#
# The original Cargo.toml inherits VectorCraft's workspace settings (workspace = true), so the values of the same
# commit are written directly. The other VectorCraft crates point to GitHub at the same commit as ArtServer.
# Tests (tests/ and dev-dependencies) are not included because ArtServer's build doesn't use them.
[package]
name = "vectorcraft-svg"
version = "0.13.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "VectorCraft SVG import and export"
publish = false

[lints.rust]
unsafe_code = "deny"

[dependencies]
vectorcraft-geom = { git = "https://github.com/storytold/vectorcraft", rev = "904f0fe5227bd987d55319e89a38b4b8f046998c" }
vectorcraft-color = { git = "https://github.com/storytold/vectorcraft", rev = "904f0fe5227bd987d55319e89a38b4b8f046998c" }
vectorcraft-doc = { git = "https://github.com/storytold/vectorcraft", rev = "904f0fe5227bd987d55319e89a38b4b8f046998c" }
vectorcraft-effects = { git = "https://github.com/storytold/vectorcraft", rev = "904f0fe5227bd987d55319e89a38b4b8f046998c" }
vectorcraft-brush = { git = "https://github.com/storytold/vectorcraft", rev = "904f0fe5227bd987d55319e89a38b4b8f046998c" }
vectorcraft-text = { git = "https://github.com/storytold/vectorcraft", rev = "904f0fe5227bd987d55319e89a38b4b8f046998c", default-features = false }
# Which paths stored in documents may be opened.
craft-docpath = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "82a24b006eefa036b43c09a67fb9a3fbd17ffe63" }
kurbo = { version = "0.13", features = ["serde"] }
usvg = { version = "0.48", default-features = false, features = ["svgz"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
# Live effect params read from filters.
serde_json = { version = "1", features = ["float_roundtrip"] }
# SVGZ (gzip, pure-Rust backend: builds for wasm).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
# Colour / transform / length parsing for the <text> fallback (MIT OR Apache-2.0; already used by usvg).
svgtypes = "0.16"
